<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen</title>
  <meta name="description" content="Passwort für die App FFW Geilsheim 150 Jahre zurücksetzen.">
  <link rel="canonical" href="https://auth.ffw-geilsheim.de/password-reset.html">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 460px;
      margin: 48px auto;
      padding: 0 18px;
      color: #1f2937;
      background: #f8fafc;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.45;
      color: #4b5563;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #d1d5db;
      background: white;
    }

    input[readonly] {
      color: #4b5563;
      background: #f1f5f9;
    }

    button {
      border: 0;
      background: #b91c1c;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .msg {
      margin-top: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #d1d5db;
      color: #64748b;
      font-size: 14px;
    }

    footer nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    footer a {
      color: #b91c1c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Passwort zurücksetzen</h1>
  <p>Bitte gib dein neues Passwort ein. Danach kannst du dich wieder in der App anmelden.</p>

  <form id="password-reset-form" autocomplete="on">
    <label for="username">E-Mail-Adresse</label>
    <input
      id="username"
      type="email"
      name="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      readonly
    >

    <label for="new-password">Neues Passwort</label>
    <input
      id="new-password"
      type="password"
      name="new-password"
      autocomplete="new-password"
      minlength="8"
      required
      disabled
    >

    <label for="new-password-confirmation">Passwort wiederholen</label>
    <input
      id="new-password-confirmation"
      type="password"
      name="new-password-confirmation"
      autocomplete="new-password"
      minlength="8"
      required
      disabled
    >

    <button id="save" type="submit" disabled>Passwort speichern</button>
  </form>

  <p id="message" class="msg" role="status" aria-live="polite">Wiederherstellungslink wird geprüft …</p>

  <footer>
    <nav aria-label="Rechtliche Informationen und Support">
      <a href="index.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="support.html">Support</a>
      <a href="account-deletion.html">Konto und Daten löschen</a>
    </nav>
  </footer>

  <script>
    const projectUrl = "https://pklabizzlbztvmievgxy.supabase.co";
    const publishableKey = "sb_publishable_DIh8CtlPkB74IKlDTlpZTQ_CtslnUNn";
    const requestTimeoutMilliseconds = 12000;

    const form = document.getElementById("password-reset-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("new-password");
    const passwordConfirmationInput = document.getElementById("new-password-confirmation");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save");

    const invalidLinkMessage = "Dieser Link ist ungültig oder abgelaufen. Bitte fordere in der App einen neuen Link an.";
    const verificationUnavailableMessage = "Der Link konnte nicht geprüft werden. Bitte öffne den Link aus der E-Mail erneut.";
    const updateFailedMessage = "Das Passwort konnte nicht gespeichert werden. Bitte öffne den Link aus der E-Mail erneut.";

    let accessToken = null;
    let recoveryVerified = false;
    let verificationStarted = false;
    let updateInProgress = false;

    function keepFormLocked() {
      recoveryVerified = false;
      accessToken = null;
      passwordInput.disabled = true;
      passwordConfirmationInput.disabled = true;
      saveButton.disabled = true;
    }

    async function initializeRecovery() {
      if (verificationStarted) {
        return;
      }
      verificationStarted = true;

      const url = new URL(window.location.href);
      const tokenHash = url.searchParams.get("token_hash");
      const type = url.searchParams.get("type");

      url.searchParams.delete("token_hash");
      url.searchParams.delete("type");
      history.replaceState(null, "", url.pathname + url.search + url.hash);

      if (!tokenHash || type !== "recovery") {
        keepFormLocked();
        message.textContent = invalidLinkMessage;
        return;
      }

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => {
        controller.abort();
      }, requestTimeoutMilliseconds);

      try {
        const response = await fetch(projectUrl + "/auth/v1/verify", {
          method: "POST",
          headers: {
            apikey: publishableKey,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token_hash: tokenHash,
            type: "recovery"
          }),
          signal: controller.signal
        });

        if (!response.ok) {
          keepFormLocked();
          message.textContent = response.status >= 500
            ? verificationUnavailableMessage
            : invalidLinkMessage;
          return;
        }

        const data = await response.json();

        if (!data.access_token || !data.user || !data.user.email) {
          keepFormLocked();
          message.textContent = invalidLinkMessage;
          return;
        }

        accessToken = data.access_token;
        usernameInput.value = data.user.email;
        passwordInput.disabled = false;
        passwordConfirmationInput.disabled = false;
        saveButton.disabled = false;
        recoveryVerified = true;
        message.textContent = "";
        passwordInput.focus();
      } catch {
        keepFormLocked();
        message.textContent = verificationUnavailableMessage;
      } finally {
        window.clearTimeout(timeoutId);
      }
    }

    initializeRecovery();

    passwordConfirmationInput.addEventListener("input", () => {
      passwordConfirmationInput.setCustomValidity("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified || !accessToken || updateInProgress) {
        return;
      }

      message.textContent = "";
      passwordConfirmationInput.setCustomValidity("");

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (passwordInput.value !== passwordConfirmationInput.value) {
        passwordConfirmationInput.setCustomValidity("Die Passwörter stimmen nicht überein.");
        passwordConfirmationInput.reportValidity();
        message.textContent = "Die Passwörter stimmen nicht überein.";
        return;
      }

      updateInProgress = true;
      saveButton.disabled = true;
      message.textContent = "Passwort wird gespeichert...";

      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => {
        controller.abort();
      }, requestTimeoutMilliseconds);

      try {
        const response = await fetch(projectUrl + "/auth/v1/user", {
          method: "PUT",
          headers: {
            apikey: publishableKey,
            Authorization: "Bearer " + accessToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: passwordInput.value
          }),
          signal: controller.signal
        });

        if (!response.ok) {
          message.textContent = updateFailedMessage;
          return;
        }

        accessToken = null;
        recoveryVerified = false;
        passwordInput.value = "";
        passwordConfirmationInput.value = "";
        passwordInput.disabled = true;
        passwordConfirmationInput.disabled = true;
        saveButton.disabled = true;
        message.textContent = "Passwort gespeichert. Du kannst dich jetzt in der App anmelden.";
      } catch {
        message.textContent = updateFailedMessage;
      } finally {
        window.clearTimeout(timeoutId);
        updateInProgress = false;

        if (recoveryVerified) {
          saveButton.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
