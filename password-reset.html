<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 460px;
      margin: 48px auto;
      padding: 0 18px;
      color: #1f2937;
      background: #f8fafc;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.45;
      color: #4b5563;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #d1d5db;
      background: white;
    }

    button {
      border: 0;
      background: #b91c1c;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .msg {
      margin-top: 14px;
      line-height: 1.4;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Passwort zurücksetzen</h1>
  <p>Bitte gib dein neues Passwort ein. Danach kannst du dich wieder in der App anmelden.</p>

  <input id="password" type="password" placeholder="Neues Passwort" autocomplete="new-password">
  <input id="password2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">
  <button id="save">Passwort speichern</button>

  <p id="message" class="msg"></p>

  <script>
    const supabase = window.supabase.createClient(
      "https://pklabizzlbztvmievgxy.supabase.co",
      "sb_publishable_DIh8CtlPkB74IKlDTlpZTQ_CtslnUNn"
    );

    const message = document.getElementById("message");
    const saveButton = document.getElementById("save");

    saveButton.addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;

      if (password.length < 8) {
        message.textContent = "Das Passwort muss mindestens 8 Zeichen lang sein.";
        return;
      }

      if (password !== password2) {
        message.textContent = "Die Passwörter stimmen nicht überein.";
        return;
      }

      saveButton.disabled = true;
      message.textContent = "Passwort wird gespeichert...";

      const { error } = await supabase.auth.updateUser({ password });

      saveButton.disabled = false;

      if (error) {
        message.textContent = "Das Passwort konnte nicht gespeichert werden. Bitte öffne den Link aus der E-Mail erneut.";
        return;
      }

      message.textContent = "Passwort gespeichert. Du kannst dich jetzt in der App anmelden.";
    });
  </script>
</body>
</html>
