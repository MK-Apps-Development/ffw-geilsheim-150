<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 460px;
      margin: 48px auto;
      padding: 0 18px;
      color: #1f2937;
      background: #f8fafc;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.45;
      color: #4b5563;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #d1d5db;
      background: white;
    }

    input[readonly] {
      color: #4b5563;
      background: #f1f5f9;
    }

    button {
      border: 0;
      background: #b91c1c;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .msg {
      margin-top: 14px;
      line-height: 1.4;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Passwort zurücksetzen</h1>
  <p>Bitte gib dein neues Passwort ein. Danach kannst du dich wieder in der App anmelden.</p>

  <form id="password-reset-form" autocomplete="on">
    <label for="username">E-Mail-Adresse</label>
    <input
      id="username"
      type="email"
      name="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      readonly
    >

    <label for="new-password">Neues Passwort</label>
    <input
      id="new-password"
      type="password"
      name="new-password"
      autocomplete="new-password"
      minlength="8"
      required
      disabled
    >

    <label for="new-password-confirmation">Passwort wiederholen</label>
    <input
      id="new-password-confirmation"
      type="password"
      name="new-password-confirmation"
      autocomplete="new-password"
      minlength="8"
      required
      disabled
    >

    <button id="save" type="submit" disabled>Passwort speichern</button>
  </form>

  <p id="message" class="msg" role="status" aria-live="polite">Wiederherstellungslink wird geprüft …</p>

  <script>
    const supabase = window.supabase.createClient(
      "https://pklabizzlbztvmievgxy.supabase.co",
      "sb_publishable_DIh8CtlPkB74IKlDTlpZTQ_CtslnUNn",
      {
        auth: {
          persistSession: false
        }
      }
    );

    const form = document.getElementById("password-reset-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("new-password");
    const passwordConfirmationInput = document.getElementById("new-password-confirmation");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("save");

    const invalidLinkMessage = "Dieser Link ist ungültig oder abgelaufen. Bitte fordere in der App einen neuen Link an.";
    let recoveryVerified = false;

    async function initializeRecovery() {
      const url = new URL(window.location.href);
      const tokenHash = url.searchParams.get("token_hash");
      const type = url.searchParams.get("type");

      url.searchParams.delete("token_hash");
      url.searchParams.delete("type");
      history.replaceState(null, "", url.pathname + url.search + url.hash);

      if (!tokenHash || type !== "recovery") {
        message.textContent = invalidLinkMessage;
        return;
      }

      try {
        const { data, error } = await supabase.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery"
        });

        const verifiedUser = data?.user;
        const verifiedSession = data?.session;

        if (error || !verifiedUser || !verifiedSession || !verifiedUser.email) {
          message.textContent = invalidLinkMessage;
          return;
        }

        usernameInput.value = verifiedUser.email;
        recoveryVerified = true;
        passwordInput.disabled = false;
        passwordConfirmationInput.disabled = false;
        saveButton.disabled = false;
        message.textContent = "";
        passwordInput.focus();
      } catch {
        message.textContent = invalidLinkMessage;
      }
    }

    initializeRecovery();

    passwordConfirmationInput.addEventListener("input", () => {
      passwordConfirmationInput.setCustomValidity("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryVerified) {
        message.textContent = invalidLinkMessage;
        return;
      }

      message.textContent = "";
      passwordConfirmationInput.setCustomValidity("");

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (passwordInput.value !== passwordConfirmationInput.value) {
        passwordConfirmationInput.setCustomValidity("Die Passwörter stimmen nicht überein.");
        passwordConfirmationInput.reportValidity();
        message.textContent = "Die Passwörter stimmen nicht überein.";
        return;
      }

      saveButton.disabled = true;
      message.textContent = "Passwort wird gespeichert...";

      try {
        const { error } = await supabase.auth.updateUser({
          password: passwordInput.value
        });

        if (error) {
          message.textContent = "Das Passwort konnte nicht gespeichert werden. Bitte öffne den Link aus der E-Mail erneut.";
          return;
        }

        message.textContent = "Passwort gespeichert. Du kannst dich jetzt in der App anmelden.";
      } catch {
        message.textContent = "Das Passwort konnte nicht gespeichert werden. Bitte öffne den Link aus der E-Mail erneut.";
      } finally {
        saveButton.disabled = false;
      }
    });
  </script>
</body>
</html>
