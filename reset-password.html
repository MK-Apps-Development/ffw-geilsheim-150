<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passwort zurücksetzen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 48px auto; padding: 0 18px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 10px; font-size: 16px; }
    button { font-weight: 700; cursor: pointer; }
    .msg { margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Passwort zurücksetzen</h1>
  <p>Bitte gib dein neues Passwort ein.</p>

  <input id="password" type="password" placeholder="Neues Passwort" autocomplete="new-password">
  <input id="password2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">
  <button id="save">Passwort speichern</button>

  <p id="message" class="msg"></p>

  <script>
    const supabase = window.supabase.createClient(
      "https://pklabizzlbztvmievgxy.supabase.co",
      "sb_publishable_DIh8CtlPkB74IKlDTlpZTQ_CtslnUNn"
    );

    const message = document.getElementById("message");

    document.getElementById("save").addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;

      if (password.length < 8) {
        message.textContent = "Das Passwort muss mindestens 8 Zeichen lang sein.";
        return;
      }

      if (password !== password2) {
        message.textContent = "Die Passwörter stimmen nicht überein.";
        return;
      }

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        message.textContent = "Das Passwort konnte nicht gespeichert werden. Bitte öffne den Link aus der E-Mail erneut.";
        return;
      }

      message.textContent = "Passwort gespeichert. Du kannst dich jetzt in der App anmelden.";
    });
  </script>
</body>
</html>
